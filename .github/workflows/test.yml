name: Test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests -t .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/test_app.cjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          checksums="gitleaks_8.30.1_checksums.txt"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 10 "$base_url/$archive" --output "$archive"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 10 "$base_url/$checksums" --output "$checksums"
          awk -v archive="$archive" '$2 == archive { print; found = 1 } END { if (!found) exit 1 }' "$checksums" > archive.sha256
          sha256sum --check --strict archive.sha256
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - run: gitleaks git --redact --log-opts="--all" .
